server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update   # dev: update | prod: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

# Liste des origines autorisées pour le front
app:
  cors:
    allowed-origins:
      - http://localhost:3000

security:
  jwt:
    # ⚠️ remplace cette clé par une vraie clé >= 32 chars, idéalement via variable d'environnement
    secret: "change-this-please-32-bytes-minimum-secret-for-hs256!!"
    expiration: 86400000   # 24h en millisecondes

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

logging:
  level:
    org.springframework.security: INFO
